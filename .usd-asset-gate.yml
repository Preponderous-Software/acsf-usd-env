# usd-asset-gate configuration (https://github.com/Preponderous-Software/usd-asset-gate).
# CI checks stages exported from the golden runs; see .github/workflows/usd-asset-gate.yml.
version: 1
fail_on: warning

rules:
  # acsf-usd writes metres, Y up, with /World as every layer's default prim.
  stage-metadata:
    metersPerUnit: 1
    upAxis: "Y"
  file-size:
    max_bytes: { default: 10MB }
