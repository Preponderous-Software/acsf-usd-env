# The Strata release `acsf-usd view` loads. `acsf-usd fetch-strata` downloads the asset for this
# platform from the release, checks it against the SHA-256 below (copied from the release's
# SHA256SUMS) and deletes it on a mismatch. ACSF_USD_STRATA_LIB points at a local build instead.

release = "v0.4.0"
version = "0.4.0"
base_url = "https://github.com/Preponderous-Software/strata/releases/download/v0.4.0"

[assets.linux-x64]
name = "libstrata-0.4.0-linux-x64.so"
sha256 = "6044127f21c33abbd03d4e39182b5a6082c73e92479236bbd0aea6e68594b181"

[assets.win-x64]
name = "strata-0.4.0-win-x64.dll"
sha256 = "1d34a949f74e47055d019e0fc7b646a14d81ce2645f6e0642a7d1b78110fdfe7"
