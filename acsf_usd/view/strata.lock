# The Strata release `acsf-usd view` loads. `acsf-usd fetch-strata` downloads the asset for this
# platform from the release, checks it against the SHA-256 below (copied from the release's
# SHA256SUMS) and deletes it on a mismatch. ACSF_USD_STRATA_LIB points at a local build instead.
# The [view] extra pins Strata's Python binding (strata-engine) to the same tag.

release = "v0.5.0"
version = "0.5.0"
base_url = "https://github.com/Preponderous-Software/strata/releases/download/v0.5.0"

[assets.linux-x64]
name = "libstrata-0.5.0-linux-x64.so"
sha256 = "44f8263426b546c04295b1033032fded97541060c8e804873894d43e80fcffcb"

[assets.win-x64]
name = "strata-0.5.0-win-x64.dll"
sha256 = "8a0ae3dedfb13cc5a0a66a4301cba6a625137d7f86e44b13bb8dbd587dfb0bcd"
