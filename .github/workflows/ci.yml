name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev]"
      - name: acsf-usd --version
        run: acsf-usd --version
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy (strict)
        run: mypy
      - name: pytest
        run: pytest
      - name: End-to-end on the golden runs (export, validate)
        run: |
          out="$RUNNER_TEMP/golden"
          mkdir -p "$out"
          acsf-usd export tests/fixtures/golden/Echo -o "$out/echo.usda"
          acsf-usd validate "$out/echo.usda" tests/fixtures/golden/Echo
          acsf-usd export tests/fixtures/golden -o "$out/golden.usdc" --binary
          acsf-usd validate "$out/golden.usdc" tests/fixtures/golden
          git diff --exit-code -- tests/fixtures
