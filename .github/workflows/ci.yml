name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev]"
      - name: acsf-usd --version
        run: acsf-usd --version
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy (strict)
        run: mypy
      - name: pytest
        run: pytest
      - name: End-to-end on the golden runs (export, validate)
        run: |
          out="$RUNNER_TEMP/golden"
          mkdir -p "$out"
          acsf-usd export tests/fixtures/golden/Echo -o "$out/echo.usda"
          acsf-usd validate "$out/echo.usda" tests/fixtures/golden/Echo
          acsf-usd export tests/fixtures/golden -o "$out/golden.usdc" --binary
          acsf-usd validate "$out/golden.usdc" tests/fixtures/golden
          git diff --exit-code -- tests/fixtures

  view:
    name: view (Strata on llvmpipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mesa (EGL, llvmpipe) and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 xvfb
      - name: Install
        run: python -m pip install ".[dev,view]"
      - name: acsf-usd fetch-strata (SHA-256 pinned in strata.lock)
        run: acsf-usd fetch-strata
      - name: Strata tests and golden images
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          ACSF_USD_VIEW_ARTIFACTS: ${{ runner.temp }}/view
        run: pytest -ra tests/test_view_strata.py
      - name: Headless --png and the window under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          out="$RUNNER_TEMP/view"
          acsf-usd export tests/fixtures/golden -o "$out/stages/run.usda"
          acsf-usd view "$out/stages/run.usda" --png "$out/golden.png" --cycle 1 --cycle 120 --instance Wren
          xvfb-run -a -s "-screen 0 1280x720x24" acsf-usd view "$out/stages/run.usda" --frames 30
      - name: Upload the rendered images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: view-images
          path: ${{ runner.temp }}/view/*.png
          if-no-files-found: warn
