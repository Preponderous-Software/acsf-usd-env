# USD asset gate: OpenUSD's validators plus this repo's house rules
# (.usd-asset-gate.yml) on stages acsf-usd exports from the committed golden runs.
# No USD is committed here, so the gate checks a sample generated in this job.
name: USD asset gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # usd-asset-gate has no release tag yet: a full commit SHA on its main branch
  # ("Bring two ARCHITECTURE.md passages up to date with the shipped MVP", 2026-10-18).
  USD_ASSET_GATE_SHA: e8b28531092a044ca6dbdf5b384e89f6ef03b516

jobs:
  generated-assets:
    name: generated stages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acsf-usd-env and usd-asset-gate (pinned)
        run: python -m pip install . "usd-asset-gate @ git+https://github.com/Preponderous-Software/usd-asset-gate@${USD_ASSET_GATE_SHA}"
      - name: Export the golden runs (one instance, all instances, binary)
        run: |
          out="$RUNNER_TEMP/usd-out"
          acsf-usd export tests/fixtures/golden/Echo -o "$out/single/echo.usda"
          acsf-usd export tests/fixtures/golden -o "$out/multi/run.usda"
          acsf-usd export tests/fixtures/golden -o "$out/binary/run.usdc" --binary
      - name: usd-asset-gate
        run: usd-asset-gate check --format github --summary "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/usd-out"
