[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "acsf-usd-env"
description = "Read-only exporter from ACSF runs to OpenUSD stages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["usd-core==26.8"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# `acsf-usd view` (RFC 0031). Strata's official Python binding (ctypes, no compiled code) is not
# on PyPI, so it is pinned to the source archive of the Strata tag strata.lock names. The native
# library is downloaded separately by `acsf-usd fetch-strata` (SHA-256 pinned in strata.lock).
view = [
    "strata-engine @ https://github.com/Preponderous-Software/strata/archive/refs/tags/v0.5.0.tar.gz#subdirectory=bindings/python",
]
dev = ["pytest>=9.1", "mypy>=2.4", "ruff>=0.17", "pillow>=11"]

[project.scripts]
acsf-usd = "acsf_usd.cli:main"

[project.urls]
Repository = "https://github.com/Preponderous-Software/acsf-usd-env"

[tool.setuptools.dynamic]
version = { attr = "acsf_usd.__version__" }

[tool.setuptools.packages.find]
include = ["acsf_usd*"]

[tool.setuptools.package-data]
acsf_usd = ["py.typed"]
"acsf_usd.view" = ["strata.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["acsf_usd", "tests"]

[[tool.mypy.overrides]]
# The Strata binding ships no py.typed (and is optional: the [view] extra); it is typed as Any.
module = ["strata", "strata.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# usd-core ships no type information; pxr is typed as Any.
module = ["pxr", "pxr.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
